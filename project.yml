
name: QuickPanel

options:
  bundleIdPrefix: com.quickpanel
  deploymentTarget:
    iOS: "18.0"

targets:
  QuickPanel:
    type: application
    platform: iOS

    sources:
      - Sources

    dependencies:
      - target: CaptureExtension
        embed: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quickpanel.personal
        PRODUCT_NAME: QuickPanel
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: QuickPanel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "カメラコントロールからQuickPanelを起動したとき、カメラ機能を利用するために使用します。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "QuickPanelのカメラで撮影した写真を写真ライブラリに保存します。"

  CaptureExtension:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - CaptureExtension
      - Sources/CaptureIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quickpanel.personal.CaptureExtension
        PRODUCT_NAME: CaptureExtension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CaptureExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: QuickPanel Capture
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
